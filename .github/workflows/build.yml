name: Build Bos OS ISO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Build ISO (Debian container)
        run: |
          mkdir -p out logs
          docker run --rm --privileged -e HOST_UID="$(id -u)" \
            -v "$PWD":/work -w /work debian:trixie bash /work/build.sh
          ls -lh out

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: logs/
          if-no-files-found: ignore

      - name: Upload ISO artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Bos-OS-iso
          path: out/*.iso
          compression-level: 0
          retention-days: 3

      - name: Checksums (split if over 2 GB)
        run: |
          cd out
          ISO=$(ls *.iso)
          sha256sum "$ISO" > SHA256SUMS.txt
          if [ "$(stat -c%s "$ISO")" -ge 2000000000 ]; then
            split -b 1900M -d "$ISO" "$ISO.part-"
            rm "$ISO"
          fi
          ls -lh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bos-os-0.1-build${{ github.run_number }}
          name: Bos OS 0.1 (build ${{ github.run_number }})
          files: out/*
